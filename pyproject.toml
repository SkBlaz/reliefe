[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliefe"
version = "0.18"
description = "ReliefE: feature ranking via manifold embeddings"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause-Clear" }
authors = [
  { name = "Blaz Skrlj" },
  { name = "Matej Petkovic" },
]
dependencies = [
  "numpy>=1.19",
  "scipy>=1.6.0",
  "tqdm>=4.30.0",
  "numba>=0.52.0",
  "scikit-learn>=1.0.0",
  "umap-learn>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/skblaz/reliefe"
Documentation = "https://skblaz.github.io/reliefe/"

[project.scripts]
reliefe-mcp = "reliefe.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.30,<2 ; python_full_version >= '3.10'",
]

[dependency-groups]
dev = [
  "coverage>=7.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["reliefe*"]

[tool.coverage.run]
source = ["reliefe"]

[tool.coverage.report]
fail_under = 100
show_missing = true
