name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Test the base library without MCP dependencies
        run: NUMBA_DISABLE_JIT=1 uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python examples/minimal_reliefe2.py

  coverage-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra mcp --group dev
      - name: Require full coverage, MCP round trips, and compiled numerical checks
        run: make test
