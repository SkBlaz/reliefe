<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1185" role="img" aria-labelledby="title desc">
<title id="title">Feature ranking</title>
<desc id="desc">Scoring families branch into rules and their algorithms. The README lists each public implementation.</desc>
<rect width="100%" height="100%" fill="white"/>
<g fill="black" font-family="Arial, Helvetica, sans-serif">
<text x="18" y="36" font-size="26" font-weight="bold">Feature ranking</text>
<text x="44" y="72" font-size="20" font-weight="bold">Marginal filters</text>
<text x="72" y="100" font-size="16" font-weight="bold">Dispersion</text>
<text x="336" y="100" font-size="15" data-methods="variance numba-variance">variance</text>
<text x="72" y="128" font-size="16" font-weight="bold">Association and group tests</text>
<text x="336" y="128" font-size="15" data-methods="pearson numba-pearson spearman numba-spearman kendall kruskal f numba-f chi2 numba-chi2">pearson, spearman, kendall, kruskal, f, chi2</text>
<text x="72" y="156" font-size="16" font-weight="bold">Censored outcome ordering</text>
<text x="336" y="156" font-size="15" data-methods="survival-concordance">survival-concordance</text>
<text x="72" y="184" font-size="16" font-weight="bold">Information and impurity</text>
<text x="336" y="184" font-size="15" data-methods="mi numba-info-gain numba-gain-ratio numba-symmetrical-uncertainty">mi, numba-info-gain, numba-gain-ratio, numba-symmetrical-uncertainty</text>
<text x="336" y="205" font-size="15" data-methods="numba-gini core-infgain core-gainratio core-mdl core-gini core-dkm">numba-gini, core-infgain, core-gainratio, core-mdl, core-gini, core-dkm</text>
<text x="72" y="233" font-size="16" font-weight="bold">Split accuracy and error</text>
<text x="336" y="233" font-size="15" data-methods="core-accuracy core-mseofmean core-myopicrelieff">core-accuracy, core-mseofmean, core-myopicrelieff</text>
<text x="72" y="261" font-size="16" font-weight="bold">Costs and split weighting</text>
<text x="336" y="261" font-size="15" data-methods="core-dkmcost core-gainratiocost core-mdlsmp core-uniformdkm">core-dkmcost, core-gainratiocost, core-mdlsmp, core-uniformdkm</text>
<text x="336" y="282" font-size="15" data-methods="core-uniformgini core-uniforminf core-uniformaccuracy core-equaldkm">core-uniformgini, core-uniforminf, core-uniformaccuracy, core-equaldkm</text>
<text x="336" y="303" font-size="15" data-methods="core-equalgini core-equalinf">core-equalgini, core-equalinf</text>
<text x="72" y="331" font-size="16" font-weight="bold">Class distribution distance</text>
<text x="336" y="331" font-size="15" data-methods="core-impurityeuclid core-impurityhellinger core-equalhellinger">core-impurityeuclid, core-impurityhellinger, core-equalhellinger</text>
<text x="336" y="352" font-size="15" data-methods="core-disthellinger core-distauc core-distangle core-disteuclid">core-disthellinger, core-distauc, core-distangle, core-disteuclid</text>
