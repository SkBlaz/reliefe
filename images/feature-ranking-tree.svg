<text x="72" y="416" font-size="16" font-weight="bold">k-NN hits and misses</text>
<text x="336" y="416" font-size="15" data-methods="relief relieff rebate-relieff core-relief core-relieffequalk">relief, relieff, core-relief, core-relieffequalk</text>
